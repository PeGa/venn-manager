# Venn Manager in one container. Open http://<host>:${VENN_PORT:-80}.
#
# Settings (shell environment or a .env file next to this one):
#   VENN_PORT              host port                                     (80)
#   VENN_DATA_DIR          host directory holding the SQLite database    (/var/lib/venn-manager)
#   VENN_TIMEZONE          household time zone on first start            (UTC)
#   VENN_ADMIN_USERNAME    first admin, created on first start           (admin)
#   VENN_ADMIN_PASSWORD    first admin's password, changed at sign-in    (admin)
#   VENN_APP_ENV           `production` adds the Secure cookie flag; needs HTTPS (development)

services:
  venn-manager:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${VENN_APP_ENV:-development}
      DEFAULT_TIMEZONE: ${VENN_TIMEZONE:-UTC}
      DEFAULT_ADMIN_USERNAME: ${VENN_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${VENN_ADMIN_PASSWORD:-admin}
    volumes:
      # A directory, not a single file: SQLite writes journal files next to the database.
      - ${VENN_DATA_DIR:-/var/lib/venn-manager}:/data
    ports:
      - "0.0.0.0:${VENN_PORT:-80}:80"
