# Run with: docker compose up -d --build
# Settings come from the environment or a .env file next to this one.
services:
  venn-manager:
    build: .
    container_name: venn-manager
    restart: unless-stopped
    ports:
      - "0.0.0.0:${VENN_PORT:-8080}:80"
    volumes:
      # Host directory holding the SQLite database (venn_manager.db).
      - "${VENN_DATA_DIR:-/var/lib/venn-manager}:/data"
    environment:
      # `production` adds the Secure cookie flag: only use it behind HTTPS.
      APP_ENV: "${APP_ENV:-development}"
      DEFAULT_ADMIN_USERNAME: "${DEFAULT_ADMIN_USERNAME:-admin}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-admin}"
      DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-UTC}"
