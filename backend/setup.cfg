[tool:pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
markers =
    production_hashing: run with werkzeug's real scrypt parameters instead
        of the cheap work factor the suite uses everywhere else
addopts =
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=90
filterwarnings =
    error
    # SQLite has no native DECIMAL type, so SQLAlchemy warns whenever a
    # Numeric(10,2) column is read. The contract's reference schema mandates
    # DECIMAL(10,2) and production runs on PostgreSQL, where the type is
    # native. The warning is development-only noise.
    ignore:Dialect sqlite\+pysqlite does \*not\ support Decimal objects natively:sqlalchemy.exc.SAWarning

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = venv, migrations/versions, .git, __pycache__
max-complexity = 10

[isort]
profile = black
line_length = 88
known_first_party = app
combine_as_imports = True

[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
plugins =
files = app, tests
exclude = (venv/|migrations/)

[mypy-flask_migrate.*]
ignore_missing_imports = True

[mypy-flask_login.*]
ignore_missing_imports = True

# grapheme ships no py.typed marker. It is used for exactly one call,
# `grapheme.length`, which returns an int.
[mypy-grapheme.*]
ignore_missing_imports = True
