# Serves the compiled frontend and forwards /api to the backend on localhost.
server {
    listen 0.0.0.0:80;
    root /app/frontend;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (/budget, /history…) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
